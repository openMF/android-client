# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  path_instructions:
    - path: "**/*ViewModel.kt"
      instructions: |
        Mifos MVI architecture rules:
        
        - All new features must follow MVI
        - ViewModel must extend BaseViewModel
        
        Required:
        - Use *State, *Event, *Action
        - Naming must be consistent (FeatureViewModel, FeatureState, FeatureEvent, FeatureAction)
        - Follow unidirectional flow:
          Action → ViewModel → State → UI
        
        Flag:
        - Missing *State / *Event / *Action
        - ViewModel not extending BaseViewModel

    - path: "**/*Screen.kt"
      instructions: |
        Mifos screen architecture rules:
        
        UI consistency:
        - Avoid hardcoded values (dp, sp, padding, fontSize, colors)
        - Use DesignToken, KptTheme, AppColors, MifosTypography for spacing, typography, and colors
        
        Code quality:
        - Keep Composables small and readable
        - Avoid deeply nested UI
        
        Each screen must follow 2-layer structure:

        - *Screen:
          - inject ViewModel (koinViewModel)
          - collect StateFlow
          - handle EventsEffect and navigation
          - should only handle state, events, and navigation

        - *ScreenContent:
          - render UI from state
          - trigger actions via onAction
          - must NOT contain business logic

        Flag:
        - Missing ScreenContent separation
        - UI logic inside *Screen
        - Business logic inside Composables
        - Hardcoded strings instead of using string resources
        - Hardcoded dp/sp values
        - Direct styling instead of using DesignToken or theme

    - path: "**/composeResources/values/strings.xml"
      instructions: |
        String resource conventions (Mifos standard):
        
        Naming:
        - All keys must follow:
          feature_{feature_name}_{ui_text_in_snake_case}
        
        Examples:
          "In Advance" → feature_loan_in_advance
          "Outstanding" → feature_loan_outstanding
        
        - Avoid generic names like: title, text1, label
        - The suffix should be a short, readable representation of the UI text
        - Avoid multiple keys representing the same UI text
        - Keys must be lowercase and use snake_case
        
        Flag:
        - Incorrect naming pattern
        - Generic or unclear key names
        - Duplicate keys for same UI text

    - path: "**"
      instructions: |
        PR Title Suggestion Guidelines:

        Analyze the pull request changes (diff) and suggest an improved PR title if needed.

        Follow commit message format:
        <type>(<scope>): <subject>

        Type must be one of:
        - feat: new feature
        - fix: bug fix
        - docs: documentation changes
        - refactor: code change without behavior change
        - test: test-related changes
        - chore: maintenance, dependency updates
        - misc: other non-production changes

        Rules:
        - Use present tense (e.g., "add login validation", not "added")
        - Keep subject concise and meaningful
        - Use lowercase (no Title Case)
        - Avoid vague titles like "update code", "fix issue"
        - Scope should reflect module/feature if identifiable (e.g., loan, auth, ui)

        Based on the code changes:
        - Identify the primary intent of the PR
        - Infer appropriate type and optional scope
        - Suggest a better PR title

        Output:
        - If current PR title is weak, unclear, or not following convention → suggest a better one
        - Format suggestion clearly like:

          Suggested PR Title:
          feat(loan): implement loan dashboard screen

        Flag:
        - Missing type prefix
        - Non-descriptive or vague title
        - Incorrect format

    - path: "**"
      instructions: |
        PR Description Validation (Mifos standard):

        The pull request description must include:

        1. Jira Ticket:
          - A valid Jira link must be present
          - Example:
            https://mifosforge.jira.com/browse/MIFOSAC-1234

        2. Before and After Evidence (MANDATORY for ALL PRs):
          - PR description must strictly contain the following sections:

            Before:
            After:

          - Each section must include supporting media (image or video link)
          - Sections must not be empty
          - Required even for:
            - Domain layer changes
            - Data layer changes
            - Refactors
          - Purpose: to ensure and prove no regressions

        Validation Rules:
        - Missing Jira link → flag
        - Missing "Before" or "After" section → flag
        - Empty "Before" or "After" section → flag
        - Missing media in either section → flag

        Output:
        - Provide clear actionable comments

        Examples:
        - "Missing Jira ticket link in PR description"
        - "Please include both 'Before' and 'After' sections with media"
        - "Before and after evidence is required even for non-UI changes to verify no regressions"