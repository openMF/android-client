# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: 'en-US'
early_access: false

chat:
  auto_reply: true

knowledge_base:
  linked_repositories:
    - repository: "sahilshivekar/fineract"
      instructions: |
        This repository is the source of truth for backend APIs used by Mifos apps.

        Use this repository for cross-repo API validation:

        API Contract Validation:
        Verify that API endpoints used in the KMP app exist in Fineract
        Validate HTTP methods (GET, POST, PUT, DELETE) are correct
        Ensure request parameters, query params, and path variables match backend expectations

        Request/Response Structure:
        Cross-check Kotlin DTOs with Fineract API request/response formats
        Validate field names, types, and nesting
        Ensure required fields are not missing

        Business Rules:
        Validate that API usage follows correct workflows (loan creation, repayment, client creation, etc.)
        Ensure required sequence/order of API calls is respected

        Flag:
        Non-existent or incorrect endpoints
        Wrong HTTP method usage
        Missing required fields in requests
        Incorrect DTO structure vs backend contract
        Misaligned API flow compared to backend expectations

        Note:
        Do NOT enforce exact duplication
        Focus on correctness and contract alignment

    - repository: "sahilshivekar/mifos-x-web-app"
      instructions: |
        This repository serves as a reference implementation for business logic, workflows, and API usage in the Mifos ecosystem.

        Use this repository to perform cross-repo validation for:
        
        API Consistency:
          - Compare API endpoints used in the KMP app with those used in the web app
          - Ensure endpoints, request patterns, and flows are consistent
          - Validate that Kotlin data classes (DTOs) in the KMP app align with the JSON field names and structures used in the web app DTOs
        
        Business Logic Alignment:
          - Use web-app as a reference for business logic and workflows
          - Ensure flows (loan, client, savings, transactions, authentication) follow similar steps
          - Validate that business validation logic is consistent across platforms
        
        Naming & Structure:
          - Ensure naming conventions for models, fields, and variables align with web-app patterns
          - Maintain consistency in feature-level structure and terminology
        
        Flag:
          - API usage that deviates from web-app patterns
          - Missing or inconsistent steps in business flows
          - Naming inconsistencies across similar features
          - Logic that contradicts existing web-app behavior
        
        Note:
          - This is context-based validation using web-app as reference
          - Flag potential inconsistencies rather than enforcing exact matches

    - repository: "sahilshivekar/kmp-project-template"
      instructions: |
        This repository is the upstream source of truth. All of `core-base` and specific modules within `core` are template-synced.
        
        Comparative Analysis Requirement:
          - If a PR modifies any file inside `core-base` or `core`, you MUST perform a side-by-side comparison with the template's implementation on the 'dev' branch.
          - Do NOT simply flag that a change occurred. Your primary goal is to explain EXACTLY how the PR implementation differs from the template.
          - Use the template file as the baseline: https://github.com/sahilshivekar/kmp-project-template/blob/dev/<filepath>
        
        Mandatory Output Format (for core/core-base modifications):
          Generate a "Template Sync Analysis" table for each modified file:
        
        | File Path | Aspect/Logic      | Template (dev)             | PR Implementation  | Recommendation (Lead Architect's Advice) |
        | :---------| :-----------------| :--------------------------| :------------------| :----------------------------------------|
        | (link)    | (e.g., Auth Flow) | (How it works in template) | (How it works now) | (Detailed justification)                 |
        
        Analysis Guidelines:
          - Handle Missing Files: If the file does not exist in the template repository, do not fail. Explicitly state that it is a new addition and evaluate if it should be upstreamed or kept local.
          - Identify the "Why": Is the difference a bug fix that should be upstreamed to the template, or an app-specific customization?
          - Detect Specificity: Flag if feature-specific or UI-specific logic is being injected into these shared modules.
        
        Note:
          - The maintainer needs to see the mechanical difference. Be precise about added lines, removed abstractions, or changed function signatures compared to the template source.

tone_instructions: |
  Wrap each table, multi-suggestion section, or content >8 lines in its own <details><summary>...</summary></details> block.
  Keep a short summary outside each block.
  Always use clickable hyperlinks for file references.

reviews:
  poem: false
  profile: "chill"
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  commit_status: true
  collapse_walkthrough: false

  path_filters:
    - '**/*'
    - '!.github/**'
    - '!**/*.svg'

  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: |
    Generate a title following: <type>(<scope>): <subject>
    Types: feat, fix, docs, refactor, test, chore, misc
    Rules: present tense, lowercase, no Jira IDs, scope reflects module/feature.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches: ['development']
    ignore_title_keywords: ['WIP', 'Draft']
    labels: ['!skip-ai-review']
    ignore_usernames: ['dependabot[bot]', 'renovate[bot]']

  pre_merge_checks:
    issue_assessment:
      mode: "off"

    docstrings:
      mode: "warning"

    title:
      mode: error
      requirements: |
        Follow commit message format: <type>(<scope>): <subject>
          Types: feat, fix, docs, refactor, test, chore, misc
          - Use present tense, lowercase, concise
          - Scope should reflect module/feature (loan, auth, ui) if identifiable
          - Do NOT include JIRA ticket numbers/IDs (e.g., MIFOSAC-123) in the title
        
        If the title is not meaningful or not in the correct format:
          - Suggest a better title
          - Base it on:
              - code changes in the PR
              - Jira ticket title (if available, use only for context, not inclusion)

    description:
      mode: error

    custom_checks:
      - name: Jira link and Before/After sections
        mode: error
        instructions: |
          PR description must include:
          1. A valid Jira link (e.g., https://mifosforge.jira.com/browse/MIFOSAC-1234)
          2. Non-empty "Before:" and "After:" sections, each with media (image/video)
          Required even for domain/data/refactor changes. Flag missing Jira link,
          missing/empty sections, or sections without media.

  path_instructions:
    - path: "**"
      instructions: |
        Cross-repository file references:
        When performing cross-repository analyses, always generate clickable GitHub file links
        using the following branch mappings:
        - sahilshivekar/mifos-x-web-app → branch: dev
          URL format: https://github.com/sahilshivekar/mifos-x-web-app/blob/dev/<filepath>
        - sahilshivekar/fineract → branch: develop
          URL format: https://github.com/sahilshivekar/fineract/blob/develop/<filepath>
        - sahilshivekar/kmp-project-template → branch: dev
          URL format: https://github.com/sahilshivekar/kmp-project-template/blob/dev/<filepath>
        - sahilshivekar/android-client → branch: feat/MIFOSAC-759
          URL format: https://github.com/sahilshivekar/android-client/blob/<branch>/<filepath>
        Rules:
        - Never output bare GitHub URLs or plain file paths.
        - Always use Markdown clickable hyperlinks.
        - Hyperlink text should be concise; prefer file names or relative paths.

    - path: "**/*ViewModel.kt"
      instructions: |
        MVI architecture rules:
        
        - All new features must follow MVI
        - ViewModel must extend BaseViewModel
        - The ViewModel MUST maintain a single UI state (e.g., a single StateFlow<FeatureState>) 
          instead of multiple separate state variables.
        
        Required:
        - Use *State, *Event, *Action
        - Naming must be consistent (FeatureViewModel, FeatureState, FeatureEvent, FeatureAction)
        - Follow unidirectional flow:
          Action → ViewModel → State → UI
        
        Flag:
        - Missing *State / *Event / *Action
        - ViewModel not extending BaseViewModel
        - Multiple separate state flows/variables in a single ViewModel.

    - path: "**/*Screen.kt"
      instructions: |
        Screen architecture rules:
        
        Each screen must follow a 2-layer structure:
        1. Layer 1 (Entry/Route Composable):
           - Function Name: Typically `*ScreenRoute` or the entry-point composable.
           - Responsibilities: Inject ViewModel (e.g., `koinViewModel`), take navigation lambdas, collect the `StateFlow`, and handle ViewModel events.
           - Logic: Should only handle ViewModel interaction, state collection, and triggering navigation in response to ViewModel events.

        2. Layer 2 (Stateful/Content Composable — `*Screen` or `*ScreenContent`):
           - Parameters: MUST only take `state` (the UI state object) and a single `onAction` lambda (e.g., `onAction: (FeatureAction) -> Unit`).
           - Responsibilities: Render the UI based strictly on the provided `state`.
           - Rule: MUST NOT pass multiple separate lambda functions for different UI interactions; consolidate them into the single `onAction`.
           - Constraint: Must NOT contain any business logic or ViewModel/Navigation references.

        Internal/private helper composables (e.g., dialogs, sections, sub-components):
        - These are NOT subject to the single `onAction` rule.
        - They may accept specific, focused lambdas (e.g., `onRetry: () -> Unit`) or a narrowed `onAction` as appropriate.
        - However, they must NOT be passed the ViewModel or navigation controllers directly.
        
        UI consistency:
        - Avoid hardcoded values (dp, sp, padding, fontSize, colors)
        - Use DesignToken, KptTheme, AppColors, MifosTypography for spacing, typography, and colors
        
        Code quality:
        - Keep Composables small and readable
        - Avoid deeply nested UI

        Flag:
        - Missing Layer 2 (`*Screen`/`*ScreenContent`) separation from the entry-point composable
        - Layer 2 (`*Screen`/`*ScreenContent`) receiving multiple separate lambdas instead of a single `onAction`
        - UI logic inside the entry-point composable
        - Business logic inside any Composable
        - Hardcoded strings instead of using string resources
        - Hardcoded dp/sp values
        - Direct styling instead of using DesignToken or KptTheme

    - path: "**/composeResources/values*/strings.xml"
      instructions: |
        String resource conventions:
        
        Naming:
        - All keys must follow:
          feature_{feature_name}_{ui_text_in_snake_case}
        
        Examples:
          "In Advance" → feature_loan_in_advance
          "Outstanding" → feature_loan_outstanding
        
        - Avoid generic names like: title, text1, label
        - The suffix should be a short, readable representation of the UI text
        - Avoid multiple keys representing the same UI text
        - Keys must be lowercase and use snake_case
        
        Flag:
        - Incorrect naming pattern
        - Generic or unclear key names
        - Duplicate keys for same UI text

    - path: "**/network/**/*.kt"
      instructions: |
        Network Layer API Guidelines:
        - One-shot API calls MUST use `suspend`, return raw response `T`, and MUST NOT use Flow or DataState.
        - Streaming APIs MUST return `Flow<T>` and MUST NOT use `suspend` or DataState.
        
        Cross-repository API comparison is mandatory even during full PR reviews or auto reviews.
        Ktorfit interfaces and request/response DTO structures are treated as API contracts and MUST trigger cross-repository API comparison.
        Trigger API comparison when:
          - Ktorfit annotations change:
            `@GET`, `@POST`, `@PUT`, `@DELETE`, `@PATCH`,
            `@Multipart`, `@FormUrlEncoded`,
            `@Body`, `@Path`, `@Query`, `@QueryMap`,
            `@Header`, `@Headers`
          - API functions are added/removed/modified
          - endpoint paths change
          - request/response DTOs change
          - parameter structure, types, or nullability change
        
        Generate exactly one API comparison section for each unique endpoint
        (URL path + HTTP method combination).
        Do nothing if no API contract changed.
        
        - Main API Comparison Table:
        
          | Checkpoint         | Fineract (Backend) | Mobile App (Current PR) | Mifos Web App | Analysis & Suggestions |
          | :------------------| :------------------| :-----------------------| :-------------| :----------------------|
          | URL Path           |                    |                         |               |                        |
          | HTTP Method        |                    |                         |               |                        |
          | Request Parameters |                    |                         |               |                        |
          | Response Structure |                    |                         |               |                        |
        
        - Rules:
          - `sahilshivekar/fineract` = source of truth for API contracts
          - `sahilshivekar/mifos-x-web-app` = reference implementation only (comparison context, not authority)
          - Mobile app analysis = extract only from the current PR network layer (endpoints, DTOs, API definitions)
          - Do NOT include ViewModel, Repository, or UI-layer logic in API comparison responses
        
        - Analysis & Suggestions must include:
          - mismatches (endpoint, method, params, DTO)
          - inconsistencies with web app
          - explicit confirmation if correct
          - precise fixes (what to change)
        
        - Flag:
          - missing required fields
          - wrong types or nullability
          - DTO mismatch (missing/extra fields)
        
        - Always produce a fully filled table when triggered.
        
        After the main API table, it is strictly required to generate TWO sections:
          1) Request Fields Comparison
          - Compare request fields across:
              - Fineract
              - Mobile App
              - Mifos Web App
          - Use this table:
            Request Fields:
            | Field | Fineract | Mobile | Web App | Notes |
            |-------|----------|--------|---------|-------|
        
          2) Response Fields Comparison
          - Compare response fields across:
              - Fineract
              - Mobile App
              - Mifos Web App
          - Use this table:
            Response Fields:
            | Field | Fineract | Mobile | Web App | Notes |
            |-------|----------|--------|---------|-------|
        
          Rules:
            - Use field names only (no full JSON)
            - Use dot notation for nested fields (e.g., address.city)
            - Notes MUST mention:
                - missing fields
                - extra fields
                - naming mismatches
                - or "aligned" if correct
            - Skip these sections if no meaningful fields are present
        It is mandatory to generate Request Fields Comparison and Response Fields Comparison
        
        - OUTPUT SCOPE CONSTRAINT
          When this path instruction triggers a cross-repo API comparison response,
          the response MUST contain ONLY the following sections:
            1. Main API Comparison Table
            2. Request Fields Comparison
            3. Response Fields Comparison
        
          Do NOT include any other suggestions, issues, refactors, validations,
          architecture concerns, or implementation feedback in the same response.
          Such observations must be raised separately as normal review comments.

    - path: "**/data/repository/**/*.kt"
      instructions: |
        Repository Interface Guidelines:
        - One-shot operations MUST use `suspend fun` and return `DataState<T>`. MUST NOT use Flow.
        - Streaming operations MUST return `Flow<DataState<T>>` and MUST NOT use `suspend`.
        - Repository interfaces must consistently return Domain models (from :core:model) wrapped in `DataState` or `Flow`.
        - Flag: Any interface method that returns a DTO or an Entity.

    - path: "**/data/repositoryImp/**/*.kt"
      instructions: |
        Repository Implementation Guidelines:
        - MUST convert `T` -> `DataState<T>` for one-shot APIs, and `Flow<T>` -> `Flow<DataState<T>>` using `.asDataStateFlow()`.
        - MUST perform network availability checks, handle exceptions, and apply appropriate dispatchers.
        - Repositories act as the boundary translator. They MUST use mappers to convert DTOs (from network) and Entities (from database) into Domain Models (from :core:model) before returning data.
        - Flag: If a repository implementation returns a raw DTO or Entity directly to the caller instead of a Domain model.

    - path: "**/data/mappers/**/*.kt"
      instructions: |
        Mapper Consistency Rules (:core:data:mappers):
        - All mapping logic MUST be centralized in this directory.
        - Allowed mappings:
          1. DTO -> Domain Model
          2. Entity <-> Domain Model
        - Flag: Any mapper functions found in any module outside of `:core:data:mappers`.

    - path: "**/core/model/**/*.kt"
      instructions: |
        Domain Model Rules (:core:model):
        - Classes defined in this module are strictly Domain Models.
        - They must be plain Kotlin data classes.
        - They MUST NOT contain network-specific annotations (e.g., `@Serializable`) or database-specific annotations (e.g., `@Entity`).
        - Rule: These are the ONLY models that should be passed to or used within ViewModels and UI Screens.
        - Flag: If a Domain model is used directly as an API request/response body or a Room database table.

    - path: "**/network/dto/**/*.kt"
      instructions: |
        DTO Rules (:core:network:dto):
        - Classes here are Data Transfer Objects (DTOs) used strictly for API communication.
        - Rule: DTOs MUST NOT be used in ViewModels, Screens, or the Domain layer.
        - Flag: If a DTO is returned directly by a Repository interface or used in UI state.

    - path: "**/database/entities/**/*.kt"
      instructions: |
        Entity Rules (:core:database:entities):
        - Classes here are Room Database Entities.
        - Entities MUST NOT be serializable (do not use `@Serializable` or implement `Serializable`).
        - Rule: Entities MUST NOT be used in ViewModels, Screens, or the Network layer.
        - Flag: If an Entity is exposed directly to the UI layer or returned by a Repository Interface.

    - path: "**/*Database.kt"
      instructions: |
        Room Database Migration Rules:
        - If there is any change to a Room schema (fields added, removed, or modified in any `@Entity` class), the `version` number in the `@Database` annotation MUST be incremented.
        - Verify if a migration strategy (e.g., `Migration` or `autoMigrations`) has been implemented for the version bump.
        - Flag schema changes that do not accompany a database version increment to prevent runtime crashes.

    - path: "**/{core-base,core}/**/*.kt"
      instructions: |
        CRITICAL:
        - Files inside `core-base` and `core` are template-synced with the `sahilshivekar/kmp-project-template` repository.
        - When this instruction triggers, cross-repository Template Sync Analysis against `kmp-project-template` is mandatory.
        - The 'Template Sync Analysis' comparison table itself is mandatory and MUST NOT be replaced with prose summaries.

    - path: "**/*.kt"
      instructions: |
        Additional Code Review Guidelines:

        1. Null Safety & Stability
        - Avoid using `!!` operator
        - Handle null cases explicitly using safe calls or proper state handling
        - Do not assume values are always non-null without guarantees

        2. Architecture Boundaries
        - ViewModel must not depend on specific network/library implementations
        - Ensure proper separation between data, domain, and presentation layers
        - Do not format data (currency, dates, calculations) inside the UI layer
        - All formatting must be handled in the ViewModel and exposed via state (e.g., StateFlow)

        3. Performance Considerations
        - Avoid unnecessary recompositions in Compose
        - Do not attach heavy logic to frequently changing states (e.g., scrollState)
        - Prefer lifting state up instead of recomputing in child composables

        4. Compose & Navigation Best Practices
        - NEVER trigger navigation functions or side-effects directly during composition
        - Always wrap navigation calls inside `LaunchedEffect` or `EventsEffect` to avoid repeated execution on recomposition
        - Avoid triggering intensive side-effects during recomposition
        - Navigation routes must be type-safe.
        - Ensure all route classes or objects used for navigation are annotated with `@Serializable`.

        5. UI Structure
        - Dialogs must be separated into their own composables
        - Do not embed dialogs inline within complex main screens

        6. Localization Consistency
        - Ensure all supported languages are updated consistently across modules
        - Verify translations exist for newly added UI strings

        7. Code Cleanliness
        - Avoid unnecessary inline comments unless critical
        - Remove leftover debug or commented code

        8. Focus on correctness, readability, and maintainability over cosmetic nitpicks.
        - Avoid reviewing README, config, or asset files.
        - Prioritize identifying bugs, performance issues, and architectural concerns.

        9. Naming & Intent Rules:
        - Follow the official Kotlin Coding Conventions:
          https://kotlinlang.org/docs/coding-conventions.html
        - Use self-explanatory names:
          Names should clearly convey purpose and content without needing additional explanation.
        - Avoid explanatory comments for names:
          If a variable or function requires a comment to clarify its meaning, rename it.
        - Prefer clarity over brevity:
          Do not use cryptic or non-standard abbreviations.
        - Ensure consistency:
          Naming should be uniform across the codebase and align with Kotlin standards.
