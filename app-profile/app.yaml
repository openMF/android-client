# ── Deploy targets — matches the pre-sync settings.gradle.kts module set (cmp-android/ios/desktop/web all present) ──
targets:
  android: { enabled: true, tier: internal }
  ios:     { enabled: true, tier: internal }
  macos:   { enabled: false, tier: internal }   # cmp-desktop targets Windows/Linux/macOS jointly; no macOS-specific signing found — GAP, defer
  web:     { enabled: true, tier: internal }
  windows: { enabled: true, tier: internal }
  ubuntu:  { enabled: true, tier: internal }
