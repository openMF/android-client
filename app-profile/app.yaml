  city: ""        # GAP
  state: ""       # GAP
  country: ""     # GAP

store:
  primary_locale: en-US
  title: "MifosXDroid"        # EXTRACTED — app display name; GAP for a curated store title/subtitle/description
  subtitle: ""                # GAP — not found on disk
  promotional_text: ""        # GAP
  description: ""             # GAP — field-officer-app has no committed store listing copy; defer to human (out of scope for this migration)
